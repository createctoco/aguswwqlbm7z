name: Deploy Cloudflare hybrid catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - astro.config.ts
      - wrangler.jsonc
      - migrations/**
      - src/**
      - scripts/build-d1-import.mjs
      - scripts/deploy-locales.mjs
      - package.json
      - package-lock.json
      - .github/workflows/cloudflare-deploy.yml

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configure production D1 database
        env:
          D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
        run: >-
          node --input-type=module -e "import fs from 'node:fs';
          if(!process.env.D1_DATABASE_ID) throw new Error('CLOUDFLARE_D1_DATABASE_ID is required');
          const path='wrangler.jsonc'; const value=fs.readFileSync(path,'utf8').replace('00000000-0000-0000-0000-000000000000',process.env.D1_DATABASE_ID);
          fs.writeFileSync(path,value);"
      # D1 is the serving database for product/collection pages. It is populated
      # by a controlled manual import (scripts/build-d1-import.mjs + wrangler d1
      # execute) and must NOT be written from this workflow: CI-run D1 imports
      # have repeatedly triggered Cloudflare's D1 storage error (code 7500) and
      # corrupted the database. This step only verifies the database is healthy
      # before Workers are deployed against it.
      - name: Verify D1 catalog health
        run: node scripts/verify-d1-health.mjs
      - name: Build and deploy English plus 13 language Workers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          OUOOO_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          OUOOO_SESSION_KV_ID: ${{ secrets.CLOUDFLARE_SESSION_KV_ID }}
          OUOOO_MANAGE_ROUTES: '0'
        run: npm run deploy:locales
      - name: Purge Cloudflare cache
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
        run: node scripts/purge-cloudflare-cache.mjs
