name: Multilingual catalog generation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/translate-catalog.mjs
      - src/data/site-catalog.json
      - src/i18n/locales.json
      - .github/workflows/multilingual-bootstrap.yml

permissions:
  contents: write
  actions: write

concurrency:
  group: multilingual-catalog-generation
  cancel-in-progress: false

jobs:
  translate:
    name: Translate ${{ matrix.locale }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        locale: [it, es, fr, pt, pl, de, fil, hr, sl, ro, ar, zh-hant, zh-hans]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate or refresh localized catalog
        env:
          OUOOO_LOCALE: ${{ matrix.locale }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: npm run translate:catalog
      - name: Validate localized catalog
        env:
          LOCALE: ${{ matrix.locale }}
        run: >-
          node --input-type=module -e "import data from './src/data/i18n/${LOCALE}/site-catalog.json' with {type:'json'};
          if(data.locale!==process.env.LOCALE || !data.products?.length || data.products.some((p)=>!p.title || !p.localization?.translations?.[process.env.LOCALE]))
          throw new Error('Invalid localized catalog');
          console.log(process.env.LOCALE, data.translationSummary);"
      - uses: actions/upload-artifact@v4
        with:
          name: locale-${{ matrix.locale }}
          path: src/data/i18n/${{ matrix.locale }}/site-catalog.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Start from the latest main branch
        shell: bash
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: locale-*
          path: localized-artifacts
      - name: Assemble localized catalogs
        shell: bash
        run: |
          for locale in it es fr pt pl de fil hr sl ro ar zh-hant zh-hans; do
            mkdir -p "src/data/i18n/$locale"
            cp "localized-artifacts/locale-$locale/site-catalog.json" "src/data/i18n/$locale/site-catalog.json"
          done
      - name: Validate complete locale set
        run: >-
          node --input-type=module -e "import fs from 'node:fs';
          const locales='it es fr pt pl de fil hr sl ro ar zh-hant zh-hans'.split(' ');
          for(const locale of locales){const data=JSON.parse(fs.readFileSync('src/data/i18n/'+locale+'/site-catalog.json','utf8'));
          if(data.locale!==locale || !data.products.length) throw new Error('Invalid '+locale);}
          console.log('Validated localized catalogs:', locales.length);"
      - name: Commit localized catalogs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/i18n
          git diff --cached --quiet || git commit -m "Generate 13 localized product catalogs"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish localized catalogs after $attempt attempts." >&2
              exit 1
            fi

            echo "main advanced while publishing; rebasing before retry $((attempt + 1))/5."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
      - name: Trigger production deployment
        # Bot commits do not trigger other workflows, so dispatch the deploy
        # explicitly so the freshly translated localized catalogs go live.
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Dispatch against the exact commit we just pushed so the deploy
          # builds the freshly translated catalogs (avoids a ref-propagation race).
          SHA="$(git rev-parse HEAD)"
          echo "Dispatching production deployment for $SHA"
          gh workflow run "Deploy Cloudflare hybrid catalog" --repo "${{ github.repository }}" --ref "$SHA"

