name: Reconcile D1

on:
  workflow_dispatch:
  schedule:
    # 11:30 Asia/Shanghai every day, after the 02:00 UTC catalog sync + deploy.
    - cron: '30 3 * * *'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile D1 with committed catalogs
        # Compares D1 against the committed site catalogs for every locale and
        # self-heals drift: re-imports missing products/categories and deletes
        # stale products that are no longer in the catalog.
        run: node scripts/reconcile-d1.mjs
